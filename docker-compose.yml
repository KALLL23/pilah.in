services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-pilahin}
      DATABASE_USER: ${DATABASE_USER:-pilahin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-pilahin-local-only}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pilahin-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pilahin-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-pilahin}
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-v1}
      CLASSIFICATION_MODEL: /models/waste_cls.pt
      CLASSIFICATION_MODEL_VERSION: ${CLASSIFICATION_MODEL_VERSION:-PILAH-CLS-v0.1.0}
      CLASSIFICATION_IMAGE_SIZE: ${CLASSIFICATION_IMAGE_SIZE:-224}
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD:-0.70}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      PRESIGNED_URL_EXPIRY_SECONDS: ${PRESIGNED_URL_EXPIRY_SECONDS:-900}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./models:/models:ro

  postgres:
    image: postgis/postgis:15-3.4
    command: ["postgres", "-c", "timezone=Asia/Jakarta"]
    environment:
      POSTGRES_USER: ${DATABASE_USER:-pilahin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pilahin-local-only}
      POSTGRES_DB: ${DATABASE_NAME:-pilahin}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
      PGTZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${DATABASE_PORT_FORWARD:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pilahin-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pilahin-local-secret}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${MINIO_PORT_FORWARD:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_FORWARD:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}" &&
        mc stat "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pilahin-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pilahin-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-pilahin}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  minio_data:
