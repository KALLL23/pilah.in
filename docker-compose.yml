version: '3.8'

services:
  api:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    env_file:
      - .env
    volumes:
      - ./models:/models

  postgres:
    # Menggunakan image PostGIS agar bisa memproses koordinat GPS Kota Semarang
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"  # MinIO API Port
      - "9001:9001"  # MinIO UI Port
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: